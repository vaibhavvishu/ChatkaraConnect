name: chatkaraconnect_flutter
description: "A Flutter app for ChatkaraConnect - Catering service platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # State Management
  provider: ^6.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  
  # Date & Time
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  shared_preferences_foundation: 2.3.5
  path_provider_foundation: 2.3.2
